# Local PostgreSQL for development. Credentials come from .env (never hard-coded).
services:
  postgres:
    image: postgres:16
    container_name: insurance-bi-postgres
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
